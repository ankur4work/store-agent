# Shopify app manifest.
#
# `client_id` is public — it is in every OAuth redirect. The API SECRET is not
# here and must never be: it lives in .env (gitignored) and in the deployment's
# environment.
#
# `application_url` is the public HTTPS origin: https://storeagent.tech
#
# It must match SHOPIFY_APP_URL in the deployment exactly — no trailing slash,
# same scheme and host. A mismatch surfaces as a redirect_uri error mid-install,
# which is the worst possible moment to discover it.
#
# For local development instead, run a tunnel and put its URL in BOTH places:
#
#   cloudflared tunnel --url http://localhost:8787
#
# A quick tunnel gets a new URL on every restart, so both have to change
# together.

name = "StoreAgent"
handle = "storeagent"
client_id = "37c27b85fef223ec4f8b89893af17ac6"
application_url = "https://storeagent.tech"
embedded = true

[access_scopes]
# Catalog access plus order webhooks for revenue attribution.
# orders/create requires read_orders; no customer identity fields are used.
scopes = "read_products,read_orders"

[auth]
redirect_urls = [
  "https://storeagent.tech/shopify/auth/callback"
]

[webhooks]
api_version = "2026-07"

# ABSOLUTE urls, not "/shopify/webhooks".
#
# A relative uri is resolved against the App URL held in the Partner
# Dashboard, not against application_url in this file. With an App URL of
# https://storeagent.tech/admin — which is what opens the embedded admin —
# every webhook resolved to /admin/shopify/webhooks, and app review failed
# its HMAC check with a 404: "Expected HTTP 401, received HTTP 404". The
# endpoint was correct the whole time and was never reached.
#
# An absolute url cannot be re-based, so the two settings can never drift
# apart again.

  # The GDPR three are MANDATORY for app review. An app that does not respond
  # correctly to them is rejected.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://storeagent.tech/shopify/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact", "customers/redact", "customers/data_request" ]
  uri = "https://storeagent.tech/shopify/webhooks"

  # Attribution reconciliation (Phase 2) — the server-side source of truth for
  # whether the agent earned a sale.
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "https://storeagent.tech/shopify/webhooks"

  # Billing state. Shopify is the authority on whether a subscription is
  # active, cancelled or frozen; without this our record drifts silently and we
  # keep serving a shop that stopped paying — or keep a paid one blocked.
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "https://storeagent.tech/shopify/webhooks"

[build]
automatically_update_urls_on_dev = true
