<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northfield Supply — Outerwear</title>
<style>
  :root{--ink:#16181a;--paper:#f7f5f1;--line:rgba(0,0,0,.1);--accent:#1f3a3d}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--paper);color:var(--ink)}
  header{border-bottom:1px solid var(--line);background:#fff}
  .bar{max-width:1080px;margin:auto;padding:18px 24px;display:flex;align-items:center;gap:28px}
  .logo{font-weight:700;letter-spacing:-.02em}
  nav a{color:inherit;text-decoration:none;opacity:.7;font-size:14.5px}
  nav a:hover{opacity:1}
  nav{display:flex;gap:20px;margin-left:auto}
  main{max-width:1080px;margin:auto;padding:40px 24px 96px}
  h1{font-size:30px;letter-spacing:-.02em;margin:0 0 6px}
  .sub{opacity:.65;margin:0 0 32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:26px}
  .p{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .p img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:rgba(0,0,0,.05)}
  .p .body{padding:14px}
  .p h3{margin:0 0 4px;font-size:15px}
  .p .price{font-size:14px;opacity:.75}
  .p .oos{font-size:12px;color:#a33;margin-top:6px}
  .note{max-width:1080px;margin:0 auto 28px;padding:14px 18px;background:#fff;
    border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;font-size:14px}
  .note b{display:block;margin-bottom:2px}
  code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="logo">Northfield Supply</span>
    <nav><a href="/">Outerwear</a><a href="/collections/knitwear">Knitwear</a><a href="/cart">Cart</a></nav>
  </div>
</header>

<main>
  <div class="note">
    <b>Demo storefront</b>
    Not a real shop — a harness for the StoreAgent widget. Tap the button bottom-right.
    Try <code>do you have a warm wool coat?</code>, <code>what's your return policy?</code>,
    or <code>is the overcoat available in L?</code>
  </div>

  <h1>Outerwear</h1>
  <p class="sub">Built for weather, cut for cities.</p>
  <div class="grid" id="grid"></div>
</main>

<script>
  fetch('/api/catalog')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      document.getElementById('grid').innerHTML = d.products.map(function (p) {
        var price = '$' + (p.price_range.min.amount / 100).toFixed(2);
        var oos = p.variants.filter(function (v) { return !v.available; });
        return '<article class="p"><img src="' + p.image + '" alt="" width="400" height="500">' +
          '<div class="body"><h3>' + p.title + '</h3><div class="price">' + price + '</div>' +
          (oos.length ? '<div class="oos">Sold out: ' + oos.map(function (v) { return v.title; }).join(', ') + '</div>' : '') +
          '</div></article>';
      }).join('');
    });
</script>

<script src="/widget.js" data-api="" defer></script>
</body>
</html>
